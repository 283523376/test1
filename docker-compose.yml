# REGISTRY_MIRROR (from the project `.env`, gitignored) lets base images be pulled
# through a mirror on China networks. Leave unset for Docker Hub.
x-build-args: &build-args
  REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}

services:
  model-api:
    build:
      context: ./model-api
      args: *build-args
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - DATABASE_PATH=/data/housing.db
    volumes:
      - model-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  market-api:
    build:
      context: ./market-api
      args: *build-args
    ports:
      - "8080:8080"
    environment:
      - MODEL_API_URL=http://model-api:8000
    depends_on:
      model-api:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      args: *build-args
    ports:
      - "3000:3000"
    environment:
      - MODEL_API_URL=http://model-api:8000
      - MARKET_API_URL=http://market-api:8080
      - NEXT_PUBLIC_MODEL_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MARKET_API_URL=http://localhost:8080
    depends_on:
      - model-api
      - market-api

volumes:
  model-data:
